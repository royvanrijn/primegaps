name: Fetch BGP212 manuscript

on:
  push:
    paths:
      - .github/workflows/fetch-bgp212.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils dnsutils

      - name: Fetch manuscript and render it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/pages artifact/site
          dig +short primegaps.axiommath.ai A > artifact/site/dns-a.txt
          dig +short primegaps.axiommath.ai CNAME > artifact/site/dns-cname.txt
          curl --fail --location --retry 5 --retry-all-errors \
            --dump-header artifact/http-headers.txt \
            https://primegaps.axiommath.ai/bgp212.pdf \
            --output artifact/bgp212.pdf
          curl --fail --location https://primegaps.axiommath.ai/ \
            --output artifact/site/index.html || true
          file artifact/bgp212.pdf | tee artifact/file.txt
          sha256sum artifact/bgp212.pdf | tee artifact/sha256.txt
          pdfinfo artifact/bgp212.pdf | tee artifact/pdfinfo.txt
          pdftotext -layout artifact/bgp212.pdf artifact/bgp212.txt
          pages=$(pdfinfo artifact/bgp212.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -png -r 130 -f 1 -l "$pages" \
            artifact/bgp212.pdf artifact/pages/page >/dev/null 2>&1

      - name: Publish temporary PDF branch for rendered inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "primegaps research bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p external
          cp artifact/bgp212.pdf external/bgp212.pdf
          git add -f external/bgp212.pdf
          git commit -m "Temporary BGP212 PDF mirror for inspection"
          git push --force origin HEAD:refs/heads/bgp212-source

      - name: Upload manuscript bundle
        uses: actions/upload-artifact@v4
        with:
          name: bgp212-manuscript
          path: artifact
          if-no-files-found: error
          retention-days: 7
