name: Fetch BGP212 manuscript

on:
  push:
    paths:
      - .github/workflows/fetch-bgp212.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils dnsutils

      - name: Fetch manuscript and site metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/pages artifact/site
          dig +short primegaps.axiommath.ai A > artifact/site/dns-a.txt
          dig +short primegaps.axiommath.ai CNAME > artifact/site/dns-cname.txt
          curl --fail --location --retry 5 --retry-all-errors \
            --dump-header artifact/http-headers.txt \
            https://primegaps.axiommath.ai/bgp212.pdf \
            --output artifact/bgp212.pdf
          curl --fail --location https://primegaps.axiommath.ai/ \
            --output artifact/site/index.html || true
          curl --fail --location https://primegaps.axiommath.ai/robots.txt \
            --output artifact/site/robots.txt || true
          curl --fail --location https://primegaps.axiommath.ai/sitemap.xml \
            --output artifact/site/sitemap.xml || true
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {"href", "src"} and value:
                          self.values.append((tag, key, value))

          path = Path("artifact/site/index.html")
          parser = Links()
          if path.exists():
              parser.feed(path.read_text(errors="replace"))
          Path("artifact/site/links.txt").write_text(
              "".join(f"{tag}\t{key}\t{value}\n" for tag, key, value in parser.values)
          )
          PY
          file artifact/bgp212.pdf | tee artifact/file.txt
          sha256sum artifact/bgp212.pdf | tee artifact/sha256.txt
          pdfinfo artifact/bgp212.pdf | tee artifact/pdfinfo.txt
          pdftotext -layout artifact/bgp212.pdf artifact/bgp212.txt
          pages=$(pdfinfo artifact/bgp212.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -png -r 130 -f 1 -l "$pages" \
            artifact/bgp212.pdf artifact/pages/page >/dev/null 2>&1

      - name: Upload manuscript bundle
        uses: actions/upload-artifact@v4
        with:
          name: bgp212-manuscript
          path: artifact
          if-no-files-found: error
          retention-days: 7
