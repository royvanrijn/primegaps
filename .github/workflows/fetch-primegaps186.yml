name: Fetch PrimeGaps186 inspection bundle

on:
  push:
    paths:
      - .github/workflows/fetch-primegaps186.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Fetch and inspect PrimeGaps186
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/pages
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/openai/PrimeGaps186/main/short_gaps_numerics.pdf \
            --output artifact/short_gaps_numerics.pdf
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/openai/PrimeGaps186/main/prime_gap_186_certificate.py \
            --output artifact/prime_gap_186_certificate.py
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/openai/PrimeGaps186/main/Challenge.lean \
            --output artifact/Challenge.lean
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/openai/PrimeGaps186/main/PrimeGaps186.lean \
            --output artifact/PrimeGaps186.lean
          pdfinfo artifact/short_gaps_numerics.pdf | tee artifact/pdfinfo.txt
          pdftotext -layout artifact/short_gaps_numerics.pdf artifact/short_gaps_numerics.txt
          pages=$(pdfinfo artifact/short_gaps_numerics.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -png -r 150 -f 1 -l "$pages" \
            artifact/short_gaps_numerics.pdf artifact/pages/page >/dev/null 2>&1
          sha256sum artifact/*.{pdf,py,lean} > artifact/sha256.txt

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: primegaps186-inspection
          path: artifact
          if-no-files-found: error
          retention-days: 2
