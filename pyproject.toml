[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "primegaps"
version = "0.1.0"
description = "Exploratory optimizer for Stadlmann/Maynard prime-gap sieve support"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
sparse = ["scipy>=1.13"]
exact = ["gmpy2>=2.1"]

[project.scripts]
primegaps-proof = "primegaps.proof_backend:main"

[tool.setuptools.packages.find]
where = ["src"]
